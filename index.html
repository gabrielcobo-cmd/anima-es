<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Polo | O Futuro do Nosso Meio Ambiente</title>
    <style>
        /* Estilos Globais e Reset Simples */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a; /* Fundo escuro moderno */
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }

        /* Container Principal do Card */
        .article-container {
            max-width: 750px;
            margin: 40px auto;
            background-color: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Cabeçalho do Card (Hero Section) */
        header {
            background: linear-gradient(135deg, #15803d 0%, #052e16 100%);
            border-bottom: 4px solid #22c55e;
            padding: 40px 30px;
            text-align: center;
        }

        /* Badge de Categoria */
        .category-tag {
            display: inline-block;
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        header h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header h2 {
            font-size: 1.2rem;
            color: #cbd5e1;
            font-weight: 400;
        }

        /* Conteúdo do Post */
        .post-content {
            padding: 35px 30px 25px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        .post-content p {
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: #e2e8f0;
            text-align: justify;
        }

        /* Seção de Curiosidades */
        .curiosities-box {
            background-color: rgba(15, 23, 42, 0.6);
            border-left: 4px solid #22c55e;
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
        }

        .curiosities-box h3 {
            color: #4ade80;
            font-size: 1.15rem;
            margin-bottom: 12px;
        }

        .curiosities-box ul {
            list-style: none;
            padding-left: 0;
        }

        .curiosities-box li {
            margin-bottom: 10px;
            font-size: 0.98rem;
            color: #cbd5e1;
            padding-left: 20px;
            position: relative;
        }

        .curiosities-box li::before {
            content: "🌱";
            position: absolute;
            left: 0;
            top: 0;
        }

        /* Seção de Botões/Interação */
        .actions {
            display: flex;
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        /* Estilo para quando o botão estiver ativado */
        .btn-action.active-like {
            background-color: #15803d;
            color: #ffffff;
        }

        .btn-action.active-dislike {
            background-color: #991b1b;
            color: #ffffff;
        }

        .btn-action span {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <article class="article-container">
        <header>
            <span class="category-tag">✦ Reflexão
